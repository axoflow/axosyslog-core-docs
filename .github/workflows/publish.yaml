name: Publish

# Publishes the latest documentation (main) to the site root,
# https://axoflow.com/docs/axosyslog-core/.
#
# All build + deploy logic lives in the reusable publish-docs.yaml workflow, so
# every version is built by the same steps. Archived versions are published by
# publish-versions.yaml (on demand) and publish-version-on-push.yaml (on a push
# to a release branch).

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "publish-latest"
  cancel-in-progress: true

jobs:
  publish-latest:
    name: Publish latest
    uses: ./.github/workflows/publish-docs.yaml
    with:
      ref: main
      is_latest: true
    secrets:
      R2_PUBLIC_EDITOR_ACCESS_KEY_ID: ${{ secrets.R2_PUBLIC_EDITOR_ACCESS_KEY_ID }}
      R2_PUBLIC_EDITOR_ACCESS_KEY_SECRET: ${{ secrets.R2_PUBLIC_EDITOR_ACCESS_KEY_SECRET }}
