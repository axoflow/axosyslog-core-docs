name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/Krypton
          cache: npm
          cache-dependency-path: package-lock.json

      # Bootstrap and FontAwesome SCSS, exposed through Docsy's Hugo mounts
      # (themes/docsy/hugo.yaml). npm ci is impossible here — Docsy gitignores
      # its own lockfile — but it pins both runtime deps exactly, so install is
      # still deterministic. --omit=dev skips Docsy's lint/test toolchain and
      # its docsy.dev workspace; the site build uses neither.
      - name: Install Docsy assets
        run: npm install --omit=dev
        working-directory: themes/docsy

      # postcss-cli binary plus the autoprefixer/purgecss plugins. Must be at
      # the project root: that is where Hugo Pipes looks for node_modules/.bin
      # and where postcss.config.js resolves its require() calls from.
      - name: Install PostCSS toolchain
        run: npm ci

      - name: Build
        run: hugo
