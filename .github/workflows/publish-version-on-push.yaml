name: Publish archived version on push

# Auto-republishes an archived version when its release branch gets a new commit.
# The pushed branch is mapped to a version id via data/versions.yaml (from main):
# it publishes only if some non-latest entry's `ref` equals the branch name. So a
# version pinned to a tag is never touched by a push — only versions whose `ref`
# is this branch. The latest version (main) is handled by publish.yaml; this
# workflow never touches the site root.
#
# It builds nothing itself: it starts main's "Publish versions" for the version,
# so every version is built by main's pipeline (publish-docs.yaml, pdf.yaml, and
# the theme actions main pins). Release branches carry no copy of the pipeline
# that could fall behind.
#
# IMPORTANT: for `push` events GitHub runs the workflow definition from the pushed
# branch, not from main. THIS file must therefore exist on every release-* branch
# that a version tracks, or pushes to that branch silently publish nothing. It
# depends on nothing else in the branch, so copying it there is enough. When a
# release branch lacks it, rebuild manually: Actions → "Publish versions" →
# version = <id>.

on:
  push:
    branches:
      - 'release-*'

permissions:
  contents: read

jobs:
  resolve:
    name: Map branch to version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.map.outputs.version }}
    steps:
      - name: Checkout main (source of truth for versions.yaml)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out the theme main pins
        run: git submodule update --init --depth 1 themes/docsy-axoflow

      - name: Map branch -> version
        id: map
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          pip install --quiet pyyaml
          python3 themes/docsy-axoflow/scripts/ci/versions.py --github-output branch-version "$BRANCH"

  # A workflow_dispatch sent with GITHUB_TOKEN does start a run (most events it
  # causes do not), so no app token or PAT is needed.
  publish:
    name: Start "Publish versions" for ${{ needs.resolve.outputs.version }}
    needs: resolve
    if: ${{ needs.resolve.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch main's pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh workflow run publish-versions.yaml -R "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          echo "::notice::Started \"Publish versions\" on main for $VERSION (pushed: $GITHUB_REF_NAME at ${GITHUB_SHA:0:8})"
