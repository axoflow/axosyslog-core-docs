# ---------------------------------------------------------------------------
# THE PHONE MENU. A SECOND MENU, BECAUSE THE LIVE SITE HAS TWO.
#
# Everything above is axoflow.com's BAR, which is what this site draws at 800px
# and up. Below 800 the live site draws
# something else entirely: `.v3-navbar_mobile-contents`, a hand-built Webflow
# block that is not generated from the bar and has diverged from it. Measured on
# 2026-08-29, the two disagree on 31 of 55 rows — `Integrations` and
# `Capabilities` are filed under `Solutions` rather than `Products`, the three
# products are plain rows rather than a group, and five links are worded
# differently. Rendering the bar at both widths, which this build used to do, is
# therefore not parity with the marketing site on a phone; it is parity with its
# desktop menu.
#
# So this block is the phone menu, and layouts/_partials/navbar-drawer.html
# renders it into the offcanvas. Same schema as `items`, minus the decoration a
# phone never sees: no `icon`, no `description`, no `mega`. A `submenu` group is
# a row that opens; an unlabelled `links` group is a run of plain rows.
#
# READ OFF THE LIVE BLOCK, NOT TRANSCRIBED. Every destination was looked up in
# `items` by host+path and the canonical, already-tagged href copied across, so
# no UTM tag is retyped here. A phone row whose destination is not in the bar is
# a mistake: check a new one against `items` before adding it.
#
# ONE ROW IS NOT LIVE'S: `Capabilities > Overview`. Without it the `/capabilities`
# landing page has no way in from a phone at all — the group's five links are its
# children, not itself — and it is on live's own bar.
#
# `About > Our Partners` was here too and was taken out on 2026-08-29 on
# instruction: live's phone menu does not list it and the phone menu as it stands
# is what was asked for. It is still on the bar, so it is a row this site reaches
# at one width and not the other, and it is the only row for which that is
# deliberate. Any other row that appears in one list and not the other is drift.
#
# `kind: nested` is live's second plain-row shape — 16px/300 at a 40px inset,
# the same rows a group's links get, used at the TOP level under `Products` where
# AxoLake, AxoRouter and Axoflow + AI are drawn as children of the `Axoflow
# Platform` row above them with no group heading between. Read as one kind, all
# four came out flat and the three products lost their indent; reported as that.

