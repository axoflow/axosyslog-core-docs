# No UTM on these: they leave axoflow.com entirely, and the live footer
# does not tag them either. Glyphs are inlined in footer/row-3.html.
#
# Order is the LIVE site's -- X / LinkedIn / GitHub / Discord, measured on
# 2026-08-29. It used to be X / GitHub / LinkedIn / Discord, and the note here
# said that was "the one place the documentation chrome has already made a
# choice". That choice was reversed on instruction when the whole footer was
# re-baselined onto axoflow.com; the two middle marks swap, and nothing else
# about the strip does.
social:
  - label: "X"
    href: "https://x.com/AxoFlowIO"
  - label: "LinkedIn"
    href: "https://www.linkedin.com/company/axoflow/"
  - label: "GitHub"
    href: "https://github.com/axoflow"
  - label: "Discord"
    href: "https://discord.gg/583Z4wjem2"
