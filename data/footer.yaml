# The marketing footer, shared with axoflow.com.
#
# Read off the live marketing site's rendered DOM rather than transcribed, then
# transformed twice: `?utm_source=docs&utm_medium=footer` is appended to every
# outbound href, and the two badge images -- which the site serves as CDN URLs
# with a Webflow hash in the filename -- are vendored under assets/img/footer/.
# To refresh: read the live footer again and redo both transforms; do not edit
# the values here by hand.
#
# Link text is verbatim from the live site with one exception: the marketing
# footer spells it `Capablities`, and this file says `Capabilities`. The live docs
# footer spells it correctly today, so carrying the typo across would have been a
# regression on this site. Marketing's own copy still needs the fix; keep this
# correction when the extraction is re-run.
#
# Rendered by layouts/_partials/footer.html and its three row partials.

logo:
  href: "https://axoflow.com/?utm_source=docs&utm_medium=footer"
  # Both files are vendored from the live site. The single
  # brand logo paints its wordmark in #0F1425, which is also the dark theme's
  # background, so a dark variant is swapped in rather than filtered.
  light: "img/footer/axoflow-logo.svg"
  dark: "img/footer/axoflow-logo-dark.svg"

tagline:
  lead: "Stop babysitting security data,"
  accent: "start putting it to work"

copyright: "All rights reserved | Copyright 2026 Axoflow"

privacy:
  label: "Privacy Policy"
  href: "https://axoflow.com/privacy-policy?utm_source=docs&utm_medium=footer"

columns:
