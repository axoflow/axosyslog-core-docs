
title = "AxoSyslog"

theme = ["docsy-axoflow", "docsy"]

baseurl = "/"

languageCode = "en-us"

enableGitInfo = true

[languages]
[languages.en]
# Repeats the top-level `title`. Kept because axoflow-docs tied its removal to
# 404.html rendering with docsy-axoflow's docs/baseof.pdf.html, but here that
# happens intermittently either way (Hugo 0.160.1, docsy-axoflow 94bdb40): the
# fix belongs in the theme, not in this key.
title = "AxoSyslog"
languageName ="English"
# Weight used for sorting.
weight = 1
[languages.en.params]
description = "Documentation for AxoSyslog, the scalable security data processor"

[outputs]
    # No `print`: it rendered every section a second time as one flattened page,
    # and nothing links to those pages. "Print this page" calls window.print(),
    # and the whole book is the PDF edition (config/pdf/).
    home = ["HTML", "llms"]
    section = ["HTML"]
    page = ["HTML"]

# output for llm bots
[outputFormats.llms]
  name        = "llms"
  baseName    = "llms"
  mediaType   = "text/plain"
  isPlainText = true

# Declared here, but only enabled by the pdf environment (config/pdf/), so the
# normal site build never renders it. docsy-axoflow ships
# layouts/docs/{baseof,list}.pdf.html; without a `pdf` output format Hugo does
# not read `.pdf.` in those names as a format, and renders the HTML section
# pages with the PDF layout instead.
[outputFormats.pdf]
  name           = "pdf"
  mediaType      = "text/html"
  baseName       = "index"
  path           = "_pdf"
  isHTML         = true
  notAlternative = true
  permalinkable  = false

## For llms.txt/markdown output rendering with `hugo serve`
[[server.headers]]
  for = "**.md"
  [server.headers.values]
    Content-Type = "text/markdown; charset=utf-8"
[[server.headers]]
  for = "**.txt"
  [server.headers.values]
    Content-Type = "text/plain; charset=utf-8"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true # default is false; applies to block-level elements other than headings
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = "fallback"
      [markup.goldmark.renderHooks.link]
        useEmbedded = "fallback"
  [markup.highlight]
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style = "tango"
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    # guessSyntax = "true"

[params]

  # NO `copyright` OR `copyright_from`: docsy-axoflow defaults them for the PDF
  # cover ("Axoflow Inc.", 2023). Set `copyright_from` here to change the year.

  # The PDF edition's author meta falls back to this (docs/baseof.pdf.html).
  project_name = "AxoSyslog"
  product_name = "AxoSyslog"

  ###############################################################################
  # Docsy-theme specific config customizations
  ###############################################################################

  # NO `archived_version` OR `url_latest_version`. The theme's version-banner
  # reads them only when data/versions.yaml is missing; this site has one.

  # The version number for the version of the docs represented in this doc set.
  #
  # Still live, in two places that are NOT the banner: the sidebar renders it next
  # to the section root as "v4.29.0" (docsy-axoflow's sidebar-tree-section.html),
  # and the fallback banner would print it. The switcher above the tree shows
  # "4.29 (current)" from data/versions.yaml, so the sidebar carries the version
  # twice; drop this param if the duplicate is unwanted.
  version = "4.30.0"
  # Names the PDF edition (<product_name>-<version_tag>.pdf, see the theme's
  # pdf/file.html) and goes on its cover. Move it with `version`.
  version_tag = "4.29.0"

  # Repository configuration (URLs for in-page links to opening issues and suggesting changes)
  github_repo = "https://github.com/axoflow/axosyslog-core-docs"
  # An optional link to a related project repo. For example, the sibling repository where your product code lives.
  github_project_repo = "https://github.com/axoflow/axosyslog/"

  # Uncomment this if your GitHub repo does not have "main" as the default branch,
  # or specify a new value if you want to reference another branch in your GitHub links
  github_branch= "main"


  # Enable Lunr.js offline search
  offlineSearch = false
  # Enable pagefind for offline search
  offlineSearchPagefind = true
  offlineSearchPagefindHideImages = true

  # PRISM IS OFF, and the ported design replaces what it did.
  #
  # Hugo's Chroma highlights at build time ([markup.highlight] above); Prism only
  # ever styles what its JavaScript tokenises at runtime. Turning the flag off
  # takes css/prism.css and js/prism.js off every page -- both were being
  # preloaded. The copy buttons on code blocks are drawn by docsy-axoflow's
  # assets/js/axo-code-copy.js, loaded from its
  # layouts/_partials/hooks/body-end.html. Docsy's own click-to-copy.js, which
  # would add a second button to every block, is switched off by
  # `disable_click2copy_chroma` in docsy-axoflow's config.
  prism_syntax_highlighting = false

  # NO `disable_click2copy_chroma`, `jstoc` OR `ui.sidebar_*`: they are
  # docsy-axoflow defaults (themes/docsy-axoflow/config/_default/config.toml).

  # User interface configuration
  [params.ui]
  #  Set to true to disable breadcrumb navigation.
  #
  # THE BREADCRUMB IS ON HERE, and unlike axoflow-docs it does not fit. Recorded
  # rather than left to be rediscovered, because the numbers decide what to do
  # next and they are not obvious from looking at one page.
  #
  # The trail is built from each ancestor's `linkTitle`, and on this site those are
  # sentences doing double duty as descriptions:
  #
  #     destination: Forward, send, and store log messages
  #     tcp, tcp6, udp, udp6: OBSOLETE - Send messages to a remote log server
  #       using the legacy BSD-syslog protocol (tcp(), udp() drivers)
  #     db-parser: Process message content with a pattern database (patterndb)
  #
  # Measured in a browser over all 490 pages with a trail. The deepest one wants
  # 1973px in a 769px row; 209 of 490 clip at least one ancestor crumb at 1440 and
  # 239 at 1152. The frame's guard holds: 0 wrap onto a second line and 0 page
  # overflows at either width, and the two lead crumbs are pinned so the mark and
  # "AxoSyslog" are never the ones cut. What a cut trail reads as:
  #
  #     [mark] > AxoSyslog > destination: ... > tcp, tcp6, udp, udp6: OBSOLETE - Send ...
  #
  # `assets/js/axo-breadcrumb.js` in the theme puts the full label back on hover
  # for exactly the crumbs the row cut, so nothing is unreachable -- but a pointer
  # tooltip is not the same as being able to read the row.
  #
  # THE FIX IS CONTENT, NOT CSS: a short `linkTitle` in the front matter of those
  # section pages, keeping the long `title` for the page itself. The breadcrumb,
  # the navigation column and the version selector all read `linkTitle`, so one
  # change shortens all three. Until then this stays on by decision, with the cost
  # above known.
  #
  # On axoflow-docs the same trail fits with room to spare -- widest 638px of 769,
  # nothing clipped at either width.
  #
  # So `breadcrumb_disable` is unset, which leaves the trail on. NO `navbar_logo`
  # OR `navbar_translucent_over_cover_disable` either: unset, the navbar does
  # what they asked for (logo shown, translucent over a cover).
  #
  # NO `footer_about_disable`, `footer_left_logo_*` OR `[params.links]`: the
  # footer is overridden whole by docsy-axoflow (its links come from the theme's
  # footer data), so Docsy's footer/{left,center,right}.html, their only
  # readers, are unreachable, and this site has no community page. NO
  # `navbar_search_disable` either: nothing reads it, the search control is the
  # theme navbar's magnifier.

##########
# Parameters for shortcodes
##########

[params.pdf]
  # "Download guide as PDF" under the page contents. The PDF is rendered by
  # .github/workflows/pdf.yaml and uploaded next to the pages; its file name
  # comes from product_name and version_tag (the theme's pdf/file.html). The
  # print settings are in config/pdf/config.toml.
  download = true

[params.product]
name = "AxoSyslog"
abbrev = "AxoSyslog"
version = "4.30"
# techversion includes patch version number, needed for install/image commands
# configversion is needed in the config file examples
techversion = "4.30.0"
configversion = "4.30"
syslog-ng = "syslog-ng"
selinux = "SELinux"
apparmor = "AppArmor"
# companyname and companyabbrev come from docsy-axoflow.
contact = "[contact us](https://axoflow.com/contact/)"

##############
# Menu
##############
# Set in config.toml in the theme

###############################################################################
# Misc customizations
###############################################################################

# Image processing configuration.
[imaging]
resampleFilter = "CatmullRom"

[minify]
  minifyOutput = true
  disableJSON = true
  [minify.tdewolff]
    [minify.tdewolff.html]
    keepQuotes = true
    keepWhitespace = true

[sitemap]
  ChangeFreq = "weekly"
  Priority = "1"

[security]
  [security.funcs]
    getenv = ['^HUGO_', 'PWD', '^DOC_', 'ENVIRONMENT']

###############################################################################
# Cascade
###############################################################################
# Stamp every doc page with a Pagefind section filter for the current version,
# so search results can be scoped per version. Read by docsy-axoflow's
# docs/baseof.html via .Page.Params.body_attribute, which puts it on <body>.
[[cascade]]
  # The version id here has to move with `params.version` and with the `latest`
  # entry of data/versions.yaml on every release: a Hugo config file takes no
  # template functions, so it cannot derive it.
  #
  # The " (current)" is part of the indexed value on purpose. Pagefind's filter
  # dropdown draws the value itself as the option label — there is no separate
  # display name — so the only way the reader sees which of "4.27" and "4.26" is
  # the release they are on is for the value to say it. It therefore has to match
  # the `name` of the `latest` entry in data/versions.yaml character for
  # character, or the switcher and the search filter name the same release
  # differently.
  #
  # THIS ADDS A STEP TO THE RELEASE, beyond bumping the number. CI overlays
  # data/versions.yaml from main onto archived builds but NOT this file — an
  # archived version is built from its own release ref, so release-4.27 keeps
  # whatever is written here. Left alone, the day 4.28 ships the unified index
  # holds "4.28 (current)" AND "4.27 (current)", two options both claiming to be
  # the release you are on. So on release: add " (current)" to the new version
  # here on main, and strip it from the outgoing version on its release branch
  # before that branch is republished.
  body_attribute = 'data-pagefind-filter="section:4.30 (current)"'
  [cascade.target]
    path = '/**'
