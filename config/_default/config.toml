
title = "AxoSyslog"

theme = ["docsy-axoflow", "docsy"]

baseurl = "/"

languageCode = "en-us"

# Language settings
contentDir = "content"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Useful when translating.
enableMissingTranslationPlaceholders = true

enableGitInfo = true

[languages]
[languages.en]
title = "AxoSyslog"
languageName ="English"
# Weight used for sorting.
weight = 1
[languages.en.params]
description = "Documentation for AxoSyslog, the scalable security data processor"
tagline = "Scalable security data processor"

[outputs]
    home = ["HTML", "print", "llms"]
    # Enable print this section menu item
    section = [ "HTML", "print" ]
    page = ["HTML"]

# output for llm bots
[outputFormats.llms]
  name        = "llms"
  baseName    = "llms"
  mediaType   = "text/plain"
  isPlainText = true

# Declared but not enabled, so the PDF edition is off. docsy-axoflow ships
# layouts/docs/{baseof,list}.pdf.html; without a `pdf` output format Hugo does
# not read `.pdf.` in those names as a format, and renders the HTML section
# pages with the PDF layout instead. No page kind lists `pdf` under [outputs],
# so nothing is built for it. To turn the PDF edition on, add it to
# outputs.home in a config/pdf/ environment (see the theme's CLAUDE.md).
[outputFormats.pdf]
  name           = "pdf"
  mediaType      = "text/html"
  baseName       = "index"
  path           = "_pdf"
  isHTML         = true
  notAlternative = true
  permalinkable  = false

## For llms.txt/markdown output rendering with `hugo serve`
[[server.headers]]
  for = "**.md"
  [server.headers.values]
    Content-Type = "text/markdown; charset=utf-8"
[[server.headers]]
  for = "**.txt"
  [server.headers.values]
    Content-Type = "text/plain; charset=utf-8"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      title = true # default is true; applies to h1-h6 elements
      block = true # default is false; applies to other block-level elements
  [markup.highlight]
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style = "tango"
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    # guessSyntax = "true"
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = "fallback"
      [markup.goldmark.renderHooks.link]
        useEmbedded = "fallback"

[params]

  # email = ""

  copyright = "Axoflow Inc."
  copyright_from = 2023

  relativeURLs = true

  # Add project name to the header
  project_name = "AxoSyslog"
  product_name = "AxoSyslog"

  #hubspotId = "39677057"

  ###############################################################################
  # Docsy-theme specific config customizations
  ###############################################################################

  # DEAD ONCE data/versions.yaml EXISTS, both of them, and kept only as the
  # fallback path. The theme's version-banner.html reads this pair exclusively in
  # its `else` branch — the one taken when the data file is absent. With the file
  # present, which version this build is and where the current one lives are both
  # derived from data/versions.yaml plus the baseURL, and an archived build needs
  # no per-branch flag flipped in its own config.
  archived_version = false

  # The version number for the version of the docs represented in this doc set.
  #
  # Still live, in two places that are NOT the banner: the sidebar renders it next
  # to the section root as "v4.27.0" (docsy-axoflow's sidebar-tree.html), and the
  # fallback banner above would print it. The switcher above the tree shows
  # "4.27 (current)" from data/versions.yaml, so the sidebar now carries the
  # version twice; drop this param if the duplicate is unwanted.
  version = "4.27.0"
  version_menu_canonicallinks = true

  # A link to latest version of the docs. Used in the "version-banner" partial to
  # point people to the main doc site. config/production and config/staging each
  # override it with their own absolute URL; this is the value the development
  # environment gets, and it used to come from the docsy-axoflow theme's config,
  # which no longer carries site-specific params.
  #
  # Also only the fallback path: the data-driven banner links to the same page at
  # the site root, derived from the baseURL, rather than to a URL written down here.
  url_latest_version = "/"

  # Repository configuration (URLs for in-page links to opening issues and suggesting changes)
  github_repo = "https://github.com/axoflow/axosyslog-core-docs"
  # An optional link to a related project repo. For example, the sibling repository where your product code lives.
  github_project_repo = "https://github.com/axoflow/axosyslog/"

  # Specify a value here if your content directory is not in your repo's root directory
  # github_subdir = ""

  # Uncomment this if your GitHub repo does not have "main" as the default branch,
  # or specify a new value if you want to reference another branch in your GitHub links
  github_branch= "main"


  # Enable Lunr.js offline search
  offlineSearch = false
  # Enable pagefind for offline search
  offlineSearchPagefind = true
  offlineSearchPagefindHideImages = true

  #####
  # Code highlighting
  #####
  # Highlighting config
  pygmentsCodeFences = true
  pygmentsUseClasses = false
  # Use the new Chroma Go highlighter in Hugo.
  pygmentsUseClassic = false
  #pygmentsOptions = "linenos=table"
  # See https://help.farbox.com/pygments.html
  pygmentsStyle = "coy"
  # PRISM IS OFF, and the ported design replaces what it did.
  #
  # Hugo's Chroma highlights at build time; Prism only ever styles what its
  # JavaScript tokenises at runtime. Turning the flag off takes css/prism.css and
  # js/prism.js off every page -- both were being preloaded -- and the copy button
  # on code blocks is drawn by assets/js/axo-code-copy.js instead, loaded from
  # layouts/_partials/hooks/body-end.html.
  prism_syntax_highlighting = false

  # ...which is why the theme's own copy button has to go off with it.
  # themes/docsy/layouts/_partials/scripts.html ships one or the other:
  #
  #   {{ if .Site.Params.prism_syntax_highlighting }} prism.js
  #   {{ else if not .Site.Params.disable_click2copy_chroma }} click-to-copy.js
  #
  # So turning Prism off wakes click-to-copy.js, which does find Chroma's blocks:
  # two copy controls per block, and the theme's is drawn with `fas fa-copy`, a
  # FontAwesome class this site has no font for once the design is ported. On a
  # site with 32 code blocks on a single page that is not an edge case.
  disable_click2copy_chroma = true

  # Use tocbot for table of contents
  [params.jstoc]
  enable = true

  # User interface configuration
  [params.ui]
  #  Set to true to disable breadcrumb navigation.
  #
  # THE BREADCRUMB IS ON HERE, and unlike axoflow-docs it does not fit. Recorded
  # rather than left to be rediscovered, because the numbers decide what to do
  # next and they are not obvious from looking at one page.
  #
  # The trail is built from each ancestor's `linkTitle`, and on this site those are
  # sentences doing double duty as descriptions:
  #
  #     destination: Forward, send, and store log messages
  #     tcp, tcp6, udp, udp6: OBSOLETE - Send messages to a remote log server
  #       using the legacy BSD-syslog protocol (tcp(), udp() drivers)
  #     db-parser: Process message content with a pattern database (patterndb)
  #
  # Measured in a browser over all 490 pages with a trail. The deepest one wants
  # 1973px in a 769px row; 209 of 490 clip at least one ancestor crumb at 1440 and
  # 239 at 1152. The frame's guard holds: 0 wrap onto a second line and 0 page
  # overflows at either width, and the two lead crumbs are pinned so the mark and
  # "AxoSyslog" are never the ones cut. What a cut trail reads as:
  #
  #     [mark] > AxoSyslog > destination: ... > tcp, tcp6, udp, udp6: OBSOLETE - Send ...
  #
  # `assets/js/axo-breadcrumb.js` in the theme puts the full label back on hover
  # for exactly the crumbs the row cut, so nothing is unreachable -- but a pointer
  # tooltip is not the same as being able to read the row.
  #
  # THE FIX IS CONTENT, NOT CSS: a short `linkTitle` in the front matter of those
  # section pages, keeping the long `title` for the page itself. The breadcrumb,
  # the navigation column and the version selector all read `linkTitle`, so one
  # change shortens all three. Until then this stays on by decision, with the cost
  # above known.
  #
  # On axoflow-docs the same trail fits with room to spare -- widest 638px of 769,
  # nothing clipped at either width.
  breadcrumb_disable = false
  # Set to true to disable the About link in the site footer
  footer_about_disable = false
  # Set to false if you don't want to display a logo (/assets/icons/logo.svg) in the top navbar
  navbar_logo = true
  # Set to true if you don't want the top navbar to be translucent when over a `block/cover`, like on the homepage.
  navbar_translucent_over_cover_disable = false
  # Enable to show the side bar menu in its compact state.
  sidebar_menu_compact = true
  # Enable to make the side bar menu foldable.
  sidebar_menu_foldable = true
  # Set to true to hide the sidebar search box (the top nav search box will still be displayed if search is enabled)
  sidebar_search_disable = true
  # Set to true to hide the navbar search box
  navbar_search_disable = true

  footer_left_logo_disable = false
  footer_left_logo_file = "icons/axoflow-logo.svg"

  sidebar_search_below_title = true # Enables search box below the doc title in the left sidebar

  [params.links]
  # End user relevant links. These will show up on left side of footer and in the community page if you have one.
  [[params.links.user]]
    name = "Community chat"
    url = "https://discord.gg/583Z4wjem2"
    icon = "fab fa-discord"
    desc = "Discussion and help from your fellow users"
  [[params.links.user]]
    name ="Twitter"
    url = "https://twitter.com/AxoFlowIO"
    icon = "fab fa-twitter"
    desc = "Follow us on Twitter to get the latest news!"
  [[params.links.user]]
    name = "Linkedin"
    url = "https://www.linkedin.com/company/axoflow/"
    icon = "fab fa-linkedin"
    desc = "Follow us on Linkedin to get the latest news!"
  # Developer relevant links. These will show up on right side of footer and in the community page if you have one.
  [[params.links.developer]]
    name = "GitHub"
    url = "https://github.com/axoflow/axosyslog/"
    icon = "fab fa-github"
    desc = "Get involved in AxoSyslog development"
